<!DOCTYPE html>
<html>
<head>
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <style>
    @media (prefers-color-scheme: dark) {
      .body-bg { background-color: #fefefe !important; }
      p, h1, a { color: #000000 !important; }
    }
  </style>
</head>
<body class="body-bg" style="background-color: #fefefe; background-image: linear-gradient(#fefefe, #fefefe); margin: 0; padding: 0;">
  <table width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#fefefe" style="background-color: #fefefe; background-image: linear-gradient(#fefefe, #fefefe);">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <h1 style="color: #000000; font-family: sans-serif;">Vous êtes invités !</h1>
        <p style="color: #000000; font-family: sans-serif; font-size: 16px;">Nous serions ravis de vous avoir à notre mariage.</p>
        <div style="margin-top: 30px;">
          <a href="{{INVITATION_LINK}}" style="background-color: #000000; color: #fefefe; padding: 15px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; font-family: sans-serif;">Voir l'invitation</a>
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
